<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${subject}">인증 메일</title>
</head>
<body style="margin:0;padding:0;background:#f4f0ff;color:#2c2240;font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f0ff;padding:32px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(44,34,64,0.12);">
                <tr>
                    <td style="background:linear-gradient(135deg,#cdb7ff,#a78bfa);padding:28px 32px;">
                        <div style="font-size:20px;font-weight:700;color:#ffffff;" th:text="${brandName}">Payvue</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px 32px;">
                        <p style="margin:0 0 12px 0;line-height:1.6;color:#3a2b55;">
                            <strong th:text="${userName}">사용자명</strong>님 <span th:text="${action}">회원가입</span>에 대한 인증메일을 발송합니다.
                        </p>
                        <p style="margin:0 0 20px 0;line-height:1.6;color:#3a2b55;">
                            아래의 링크를 통해 인증을 진행해주세요.
                        </p>
                        <div style="margin:20px 0;">
                            <a th:href="${verifyUrl}" style="display:inline-block;background:#8b5cf6;color:#ffffff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:600;">
                                인증 진행하기
                            </a>
                        </div>
                        <div style="margin-top:24px;font-size:12px;color:#7c6aa8;">
                            본 메일은 발신 전용입니다. 요청하지 않으셨다면 이 메일을 무시해주세요.
                        </div>
                    </td>
                </tr>
                <tr>
                    <td style="background:#f7f3ff;padding:20px 32px;color:#6f5a99;font-size:12px;">
                        <div th:text="${footer}">문의: contact@payvue.com</div>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
