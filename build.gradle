plugins {
  id 'java'
  id 'org.springframework.boot' version '3.2.5'
  id 'io.spring.dependency-management' version '1.1.4'
  id 'org.jetbrains.kotlin.jvm' version '1.9.24'
}

group = 'com.payvue'
version = '0.0.1-SNAPSHOT'

def javaVersion = 21

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(javaVersion)
  }
}

repositories {
  mavenCentral()
}

configurations {
  testImplementation {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
  }
  testRuntimeClasspath {
    exclude group: 'org.slf4j', module: 'slf4j-simple'
  }
}

dependencies {

  // domain module
  implementation 'com.payvue:community:0.0.1-SNAPSHOT'
  implementation 'com.payvue:asset-holdings:0.0.1-SNAPSHOT'
  implementation 'com.payvue:transaction:0.0.1-SNAPSHOT'
  implementation 'com.payvue:asset:0.0.1-SNAPSHOT'
  implementation 'com.payvue:interaction:0.0.1-SNAPSHOT'
  implementation 'com.payvue:user:0.0.1-SNAPSHOT'
  implementation 'com.payvue:alarm:0.0.1-SNAPSHOT'
  implementation 'com.payvue:payment:0.0.1-SNAPSHOT'
  implementation 'com.payvue:relation:0.0.1-SNAPSHOT'
  implementation 'com.payvue:common:0.0.1-SNAPSHOT'

  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-data-redis'
  implementation 'org.springframework.boot:spring-boot-starter-mail'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
  implementation 'org.springframework.boot:spring-boot-starter-aop'
  implementation 'org.springframework.boot:spring-boot-starter-webflux'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'

  implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
  implementation 'com.fasterxml.jackson.core:jackson-annotations'

  implementation 'org.mapstruct:mapstruct:1.5.5.Final'
  implementation 'jakarta.persistence:jakarta.persistence-api:3.1.0'
  implementation 'io.jsonwebtoken:jjwt-api:0.11.5'

  implementation "org.thymeleaf:thymeleaf:3.1.2.RELEASE"
  implementation "org.springframework:spring-webmvc:6.1.8"

  compileOnly 'org.projectlombok:lombok:1.18.30'
  annotationProcessor 'org.projectlombok:lombok:1.18.30'
  annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
  annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
  testAnnotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'

  runtimeOnly 'com.mysql:mysql-connector-j'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'com.h2database:h2'
  testImplementation 'org.awaitility:awaitility:4.2.0'
  testImplementation 'org.testcontainers:testcontainers:1.19.7'
  testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
  testImplementation 'io.jsonwebtoken:jjwt-impl:0.11.5'
  testImplementation 'io.jsonwebtoken:jjwt-jackson:0.11.5'
  testImplementation 'org.jetbrains.kotlin:kotlin-stdlib'
  testImplementation 'org.jetbrains.kotlin:kotlin-reflect'
  testImplementation 'io.kotest:kotest-runner-junit5:5.9.1'
  testImplementation 'io.kotest:kotest-assertions-core:5.9.1'
  testImplementation 'io.kotest.extensions:kotest-extensions-spring:1.1.3'
  testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

  developmentOnly 'org.springframework.boot:spring-boot-devtools'
}

tasks.named('test') {
  useJUnitPlatform()
}
